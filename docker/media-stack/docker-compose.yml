# NOTE: Jellyfin runs as the NATIVE macOS app (/Applications/Jellyfin.app) on the host,
# NOT a container — the Linux image can't use Apple VideoToolbox for hardware transcode.
# It serves host port 8096 directly; Butler reaches it via host.docker.internal:8096.
# (Retired the container 2026-05-25.)

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4
    container_name: radarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/London
    volumes:
      - radarr-config:/config
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Movies:/movies
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Anime/Movies:/anime-movies
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Downloads:/downloads
      - /Volumes/HomeServer2/media/Movies:/Volumes/HomeServer2/media/Movies
      - /Volumes/HomeServer2/media/Anime:/Volumes/HomeServer2/media/Anime
    ports:
      - "7878:7878"
    networks:
      - homeserver
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16
    container_name: sonarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/London
    volumes:
      - sonarr-config:/config
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/TV:/tv
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Anime/Series:/anime-series
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Downloads:/downloads
      - /Volumes/HomeServer2/media/TV:/Volumes/HomeServer2/media/TV
      - /Volumes/HomeServer2/media/Anime:/Volumes/HomeServer2/media/Anime
    ports:
      - "8989:8989"
    networks:
      - homeserver
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.5
    container_name: bazarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/London
    volumes:
      - bazarr-config:/config
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Movies:/movies
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/TV:/tv
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Anime/Movies:/anime-movies
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Media/Anime/Series:/anime-series
      - /Volumes/HomeServer2/media/Movies:/Volumes/HomeServer2/media/Movies
      - /Volumes/HomeServer2/media/TV:/Volumes/HomeServer2/media/TV
      - /Volumes/HomeServer2/media/Anime:/Volumes/HomeServer2/media/Anime
    ports:
      - "6767:6767"
    networks:
      - homeserver
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seerr:
    image: seerr/seerr:v3.3.0
    container_name: seerr
    environment:
      - TZ=Europe/London
    volumes:
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Config/seerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - homeserver
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  homeserver:
    external: true

volumes:
  radarr-config:
    name: radarr-config
  sonarr-config:
    name: sonarr-config
  bazarr-config:
    name: bazarr-config
