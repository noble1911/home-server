services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/London
      - WEBUI_PORT=8081
    volumes:
      - qbittorrent-config:/config
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Downloads:/downloads
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Books/Audiobooks:/audiobooks
      - ${DRIVE_PATH:-/Volumes/HomeServer}/Books/eBooks:/ebooks
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - homeserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/London
    ports:
      - "8191:8191"
    networks:
      - homeserver
    restart: unless-stopped
    # Cap PIDs: the headless-browser solver can leak processes over time
    # (observed ~48k, which exhausted the OrbStack VM's process capacity and
    # broke other containers' healthchecks with EAGAIN on exec). This confines a
    # runaway to this container — it hits the cap and restarts instead of taking
    # the whole VM down.
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.0
    container_name: prowlarr
    depends_on:
      flaresolverr:
        condition: service_healthy
    environment:
      - PUID=501
      - PGID=20
      - TZ=Europe/London
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    networks:
      - homeserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  homeserver:
    external: true

volumes:
  qbittorrent-config:
    name: qbittorrent-config
  prowlarr-config:
    name: prowlarr-config
