<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taking a break · noblehaus games</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #140c24; --ink: #f6f1ff; --muted: #b3a8c9; --accent: #ffb000; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 24px 16px; box-sizing: border-box; }
  h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #1b1030; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>This game is taking a break</h1>
  <p>Its server isn't answering right now. Try again in a minute, or pick another game.</p>
  <div><a href="/">Back to all games</a></div>
</main>
</body>
</html>
