# Machine-readable service map for the Mac Mini (192.168.1.117).
# Source of truth for "which host port is taken". `doctor.sh` greps `host_port:`
# values and cross-checks them against live `docker ps`.
#
# When you add a service: pick a free host_port (not listed below), add an entry,
# and run ./doctor.sh.

host: 192.168.1.117
docker_network: homeserver          # external: true — join this to talk to shared services

services:
  # ── home-server: butler ──────────────────────────────────────────
  - name: butler-api
    project: home-server
    container: butler-api
    host_port: 8000
    shared: true                    # brain + per-user memory + tools
  - name: butler-app
    project: home-server
    container: butler-app
    host_port: 3000                 # PWA (nginx)

  # ── home-server: voice-stack ─────────────────────────────────────
  - name: kokoro-tts
    project: home-server
    container: kokoro-tts
    host_port: 8880
    shared: true
  - name: livekit
    project: home-server
    container: livekit
    host_port: 7880                 # +7881 tcp (signaling/ICE-TCP)
  - name: livekit-media
    project: home-server
    container: livekit
    host_port: 7882                 # WebRTC media (UDP) — LAN-only, not tunnelled
  - name: livekit-agent
    project: home-server
    container: livekit-agent        # internal only

  # ── home-server: photos-files-stack ──────────────────────────────
  - name: immich-server
    project: home-server
    container: immich-server
    host_port: 2283
  - name: postgres
    project: home-server
    container: immich-postgres
    host_port: 5432
    shared: true                    # db=immich, schema=butler (+pgvector)
  - name: nextcloud
    project: home-server
    container: nextcloud
    host_port: 8080

  # host-agent: docker/host-agent/app.py via launchd uk.noblehaus.host-agent (NOT a container).
  # Bare-metal CPU/RAM/swap, native apps + docker stats, all drives, allow-listed move jobs.
  # butler-api calls host.docker.internal:7101 with X-Agent-Token (HOST_AGENT_TOKEN in butler/.env).
  - { name: host-agent,  project: home-server, host_port: 7101, native: true }

  # ── home-server: media-stack ─────────────────────────────────────
  # jellyfin is the NATIVE macOS app (/Applications/Jellyfin.app), NOT a container —
  # the Linux image can't use Apple VideoToolbox. doctor.sh lists 8096 under
  # "in registry but NOT live" because it only sees docker ps; that's expected.
  - { name: jellyfin,    project: home-server, host_port: 8096, native: true }
  - { name: sonarr,      project: home-server, container: sonarr,      host_port: 8989 }
  - { name: radarr,      project: home-server, container: radarr,      host_port: 7878 }
  - { name: bazarr,      project: home-server, container: bazarr,      host_port: 6767 }
  - { name: prowlarr,    project: home-server, container: prowlarr,    host_port: 9696 }
  - { name: seerr,       project: home-server, container: seerr,       host_port: 5055 }

  # ── home-server: download-stack ──────────────────────────────────
  - { name: qbittorrent, project: home-server, container: qbittorrent, host_port: 8081 }  # WebUI
  - { name: qbittorrent-torrent, project: home-server, container: qbittorrent, host_port: 50413 }  # torrent tcp/udp (moved off blacklisted 6881)
  - { name: flaresolverr,project: home-server, container: flaresolverr,host_port: 8191 }  # image: byparr, pinned 3.0.4 (2026-09-06; the old `latest` = v2.1.0 leaked PIDs + /tmp profiles, 54GB). pids_limit + 512m tmpfs /tmp + autoheal bound any regression
  - { name: autoheal,    project: home-server, container: autoheal }  # restarts unhealthy autoheal=true containers (byparr); internal only, no host port

  # ── home-server: books-stack ─────────────────────────────────────
  - { name: audiobookshelf, project: home-server, container: audiobookshelf, host_port: 13378 }
  - { name: lazylibrarian,  project: home-server, container: lazylibrarian,  host_port: 5299 }

  # ── home-server: smart-home-stack ────────────────────────────────
  - { name: homeassistant,  project: home-server, container: homeassistant,  host_port: 8123 }
  - { name: whatsapp-gateway, project: home-server, container: whatsapp-gateway }  # internal only

  # ── other projects ───────────────────────────────────────────────
  - { name: dont-lie-app, project: dont-lie, container: dont-lie-app, host_port: 3001 }  # "Don't Lie" web game (Expo app via nginx)
  # gunpey: browser game in ~/gunpey (gunpey.html + multiplayer/server.js Node server).
  #   No host port bound / not currently running — start with `node multiplayer/server.js` if needed.

  # ── vector-llm ───────────────────────────────────────────────────
  # vector-llm itself runs as a host Python process (no container). Its compose
  # provides ollama:
  - { name: ollama, project: vector-llm, container: ollama, host_port: 11434, shared: true, status: stopped }  # container stopped; native /Applications/Ollama.app serves :11434 on the host instead (launchd com.ollama.ollama). butler reaches it via host.docker.internal:11434 (OLLAMA_URL in butler/.env)

  # ── claude-esp ───────────────────────────────────────────────────
  - name: esp-gateway
    project: claude-esp
    container: esp-gateway
    host_port: 8770                 # ESP32 voice device bridge — deployed & running from ~/esp-gateway
